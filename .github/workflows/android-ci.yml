name: DeviceCare-KI Android verification and signed internal APK

on:
  pull_request:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devicecare-ki-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Source vulnerability, secret, license and misconfiguration gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Set up JDK 21 (Robolectric SDK 36)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.9.1
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.9.1'

      - name: Install Android 37.2 compile SDK, retaining targetSdk 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-37.2" "build-tools;36.0.0"
          gradle --version

      # Trivy's earlier filesystem scan does not resolve Gradle artifacts.
      # Produce a CI-only lockfile from the resolved runtime graph; do not mutate project lock policy.
      - name: Materialize Gradle runtime dependencies for vulnerability coverage
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/devicecare-locks.init.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
            if (project.path == ':app') {
              project.dependencyLocking { lockAllConfigurations() }
            }
          }
          GRADLE
          gradle --no-daemon --init-script "$RUNNER_TEMP/devicecare-locks.init.gradle" \
            :app:dependencies --configuration debugRuntimeClasspath --write-locks > /dev/null
          test -s app/gradle.lockfile
          grep -Eq '^[^#[:space:]][^=]*:[^=]*:[^=]*=' app/gradle.lockfile || {
            echo '::error::Gradle runtime lockfile has no resolved packages'
            exit 1
          }

      - name: Trivy resolved Gradle vulnerability and license gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,license
          severity: HIGH,CRITICAL
          format: json
          output: devicecare-trivy-resolved.json
          exit-code: '1'

      - name: Summarize resolved-package scan without disclosing raw findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report=devicecare-trivy-resolved.json
          if [ ! -s "$report" ]; then
            echo 'TRIVY_RESOLVED_REPORT=NOT_PROVEN (missing or empty)'
            exit 0
          fi
          jq -e '.Results | type == "array"' "$report" >/dev/null
          jq -r '[.Results[]? | select((.Target // "") | contains("gradle.lockfile")) | (.Packages // [])[]] | "TRIVY_GRADLE_PACKAGE_COUNT=\(length)"' "$report"
          jq -r '[.Results[]? | (.Vulnerabilities // [])[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | "TRIVY_HIGH_CRITICAL_FINDINGS=\(length)"' "$report"
          jq -c '[.Results[]? | (.Vulnerabilities // [])[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL") | {severity:.Severity,id:.VulnerabilityID,package:.PkgName,installed:.InstalledVersion,fixed:(.FixedVersion // "NOT_PROVEN")}] | .[:20][]' "$report"

      - name: Reject empty Trivy Gradle package coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s devicecare-trivy-resolved.json
          count="$(jq -r '[.Results[]? | select((.Target // "") | contains("gradle.lockfile")) | (.Packages // [])[]] | length' devicecare-trivy-resolved.json)"
          if [ "${count:-0}" -lt 1 ]; then
            echo '::error::Trivy did not report any resolved Gradle packages; vulnerability result is NOT_PROVEN'
            exit 1
          fi
          printf 'TRIVY_RESOLVED_GRADLE_PACKAGES=%s\n' "$count"
      - name: Remove temporary Trivy report (also on failure)
        if: always()
        shell: bash
        run: rm -f -- devicecare-trivy-resolved.json

      - name: Prepare internal debug signing key (never a release key)
        shell: bash
        run: |
          set -euo pipefail
          test ! -e debug.keystore
          keytool -genkeypair -noprompt -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=Android Debug,O=DeviceCare-KI Internal,C=DE"
          chmod 600 debug.keystore

      - name: Run positive and negative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Assemble internally signed debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signer and record immutable build evidence
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p evidence
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee evidence/apk-signature.txt
          sha256sum "$APK" | tee evidence/apk-sha256.txt
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "build=debug-internal-only"
            echo "signer=ephemeral-debug-key-not-google-play-release"
          } > evidence/build-identity.txt

      - name: Upload signed internal APK and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devicecare-ki-internal-signed-debug-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            evidence/apk-sha256.txt
            evidence/apk-signature.txt
            evidence/build-identity.txt
